name: mindsparq_notes
description: "MindSparQ Notes - Lightweight, fast, local-first note-taking and research app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Routing ───────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Local Database (SQLite via drift) ─────────────────────
  drift: ^2.21.0
  drift_flutter: ^0.2.7            # Dart >=3.5.0, compatible with sqlite3_flutter_libs 0.5.x
  sqlite3_flutter_libs: ^0.5.42   # Dart >=2.12.0 (compatible)
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Dependency Injection ──────────────────────────────────
  get_it: ^8.0.3

  # ── Rich Text Editor ─────────────────────────────────────
  appflowy_editor: ^3.3.0          # Dart >=3.4.0 (compatible)

  # ── Logging ───────────────────────────────────────────────
  logger: ^2.5.0

  # ── Shared Preferences (Settings) ────────────────────────
  shared_preferences: ^2.3.3

  # ── Utilities ─────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── UI ────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  phosphor_flutter: ^2.1.0

  # ── Window management (Desktop) ───────────────────────────
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code generation ───────────────────────────────────────
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
